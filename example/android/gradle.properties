org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# AGP 9 built-in Kotlin. Flutter still expects the legacy AGP DSL until its own migration finishes.
android.builtInKotlin=true
android.newDsl=false
# Maven Central may return 403 for Gradle's default HTTP client; match curl's agent.
systemProp.http.agent=curl/8.0
systemProp.https.agent=curl/8.0