buildscript {
    ext.kotlin_version = "2.3.20"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        // Used only when this plugin applies KGP itself (AGP < 9, or AGP 9+ with
        // android.builtInKotlin=false). AGP is provided by the host app.
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

plugins {
    id "com.android.library"
}

group = "com.anonimeact.secure_compressor"
version = "1.0-SNAPSHOT"

// AGP 9+ compiles Kotlin itself when built-in Kotlin is enabled. Apply KGP only
// for older AGP, or when the host app explicitly opts out with
// android.builtInKotlin=false.
//
// Use apply(plugin:) rather than `apply plugin: "kotlin-android"`. Flutter
// 3.44–3.47 decides the KGP warning by regex-matching that legacy line, so a
// conditional `apply plugin:` still flags this plugin even when the branch is
// not taken.
def agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0] as int
def builtInKotlin = providers.gradleProperty("android.builtInKotlin")
    .map { it.toBoolean() }
    .orElse(agpMajor >= 9)
    .get()
def applyKotlinGradlePlugin = agpMajor < 9 || !builtInKotlin
if (applyKotlinGradlePlugin) {
    apply(plugin: "kotlin-android")
}

android {
    namespace = "com.anonimeact.secure_compressor"

    compileSdk = 35
    ndkVersion = "27.0.12077973"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 21
    }

    dependencies {
        testImplementation("org.jetbrains.kotlin:kotlin-test")
        testImplementation("org.mockito:mockito-core:5.0.0")
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}

extensions.getByType(org.jetbrains.kotlin.gradle.dsl.KotlinAndroidProjectExtension)
    .compilerOptions
    .jvmTarget
    .set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11)
